{% extends "capteurs/base.html" %}

{% block title %}
    Supprimer {{ capteur.nom }}
{% endblock %}

{% block content %}
    <section class="card narrow">
        <h2>Confirmer la suppression</h2>

        <p>
            Voulez-vous vraiment supprimer le capteur
            <strong>{{ capteur.nom }}</strong> ?
            Cette action est définitive.
        </p>

        <form method="post" data-confirm="Confirmer la suppression du capteur « {{ capteur.nom|escapejs }} » ?">
            {% csrf_token %}

            <button class="btn btn-danger" type="submit">
                Confirmer la suppression
            </button>

            <a class="btn btn-secondary" href="{% url 'capteurs:detail' capteur.pk %}">
                Annuler
            </a>
        </form>
    </section>
{% endblock %}
